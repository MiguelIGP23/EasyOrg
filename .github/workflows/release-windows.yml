name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest

      - name: Build Windows executable
        run: python scripts/build_windows.py

      - name: Prepare release archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $archiveName = "easyOrg-$version-windows-x64.zip"
          Compress-Archive -Path "dist/easyOrg/*" -DestinationPath "dist/$archiveName" -Force
          "EASYORG_ARCHIVE=dist/$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.EASYORG_ARCHIVE }}
          generate_release_notes: true
          fail_on_unmatched_files: true
